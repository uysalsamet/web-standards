# =============================================================================
# nginx.conf — http{} level. Copied to /etc/nginx/nginx.conf in the runtime stage.
#
# This file is STATIC: the official entrypoint only runs envsubst on
# /etc/nginx/templates/*.template, never on nginx.conf. Anything that needs a
# value from the environment belongs in default.conf.template instead.
#
# What lives here and nowhere else: log_format, map{}, gzip settings,
# proxy_cache_path, limit_req_zone, open_file_cache, MIME additions.
# What must NOT live here: server{}, location{}, anything with ${VARIABLES}.
# =============================================================================

worker_processes  auto;

# Container logs are the only logs. /var/log/nginx is not writable under
# read_only: true, and a file nobody rotates fills the image layer.
error_log  /dev/stderr  warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    # The unprivileged image runs as uid 101 and cannot write /var/cache/nginx
    # sub-paths it did not create. Keep every temp path on the /tmp tmpfs.
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;

    # Additions only. Do not repeat an extension that mime.types already maps
    # (wasm, woff2 are there since nginx 1.19): a duplicate extension is an
    # [emerg] at startup, not a warning.
    types {
        application/vnd.mapbox-vector-tile  pbf mvt;
        application/geo+json                geojson;
        application/vnd.pmtiles             pmtiles;
    }
    default_type  application/octet-stream;

    server_tokens off;

    sendfile        on;
    tcp_nopush      on;   # with sendfile: fill a full packet before sending headers+body
    tcp_nodelay     on;   # but do not delay the last small packet of a response
    keepalive_timeout  65;
    reset_timedout_connection on;

    # Static files are immutable per hash, so caching the open fd is safe.
    # open_file_cache_errors stays OFF: a 404 for an asset that is being
    # deployed must not stick for 30 s after the file appears.
    open_file_cache          max=2000 inactive=60s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   off;

    # --- WebSocket upgrade idiom -------------------------------------------
    # A proxied WebSocket needs "Connection: upgrade" on upgrade requests and
    # "Connection: close"/"" on plain ones. Hard-coding 'upgrade' breaks
    # keepalive to the upstream for normal requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # --- Request id --------------------------------------------------------
    # Reuse the caller's X-Request-Id when the edge already generated one,
    # otherwise nginx's own $request_id. Same header name as [API-07].
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ''      $request_id;
    }

    # --- Access log masking ------------------------------------------------
    # Goal: never write a full credential to a log. token= keeps the first 8
    # and last 6 characters so a support ticket can still be correlated;
    # everything else is replaced whole.
    #
    # NOTE: a regex containing { } (here {8}) MUST be quoted. Unquoted, the
    # nginx parser reads '{' as a block start and dies with unexpected "{".
    map $request_uri $uri_token_masked {
        "~*^(.*[?&]token=)([^&]{8})[^&]+([^&]{6})((&.*)?)$"  "$1$2...$3$4";
        "~*^(.*[?&]token=)[^&]+((&.*)?)$"                    "$1***$2";
        default $request_uri;
    }
    map $uri_token_masked $loggable_uri {
        "~*^(.*[?&](password|pwd|secret|api_key|apikey|access_token)=)[^&]*((&.*)?)$"  "$1***$3";
        default $uri_token_masked;
    }

    # Health probes run every 10 s per container. Logging them buries real traffic.
    map $request_uri $loggable_request {
        "~^/healthz"  0;
        default       1;
    }

    # --- Structured access log --------------------------------------------
    # escape=json is mandatory: a user agent with a quote in it otherwise
    # produces a line the log shipper cannot parse.
    log_format json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$req_id",'
        '"method":"$request_method",'
        '"uri":"$loggable_uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time",'
        '"cache_status":"$upstream_cache_status"'
        '}';

    access_log /dev/stdout json if=$loggable_request;

    # --- Compression -------------------------------------------------------
    # gzip_static serves the .gz emitted at build time ([PERF-10]); gzip on
    # covers dynamic proxied JSON that has no precompressed sibling.
    # gzip_types never lists application/vnd.mapbox-vector-tile: MVT arrives
    # already gzip-encoded from the tile server and re-compressing it wastes
    # CPU for roughly 0 % gain.
    gzip              on;
    gzip_static       on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css text/xml
        application/json application/geo+json application/xml
        application/javascript application/x-javascript
        image/svg+xml;

    # --- Rate limiting -----------------------------------------------------
    # 20 r/s sustained with a burst of 40 is roughly 10x what a map dashboard
    # generates while panning. It exists to stop a runaway retry loop or a
    # scripted scrape, not to shape normal traffic.
    limit_req_zone  $binary_remote_addr  zone=api:10m rate=20r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    # --- Tile proxy cache --------------------------------------------------
    # /var/cache/nginx is writable by uid 101 in the unprivileged image, but
    # under read_only: true it MUST be a named volume or a tmpfs (see the
    # compose template). use_temp_path=off keeps temp writes in the same
    # filesystem so a finished response is a rename, not a copy.
    proxy_cache_path /var/cache/nginx/tiles
                     levels=1:2
                     keys_zone=tiles:50m
                     max_size=5g
                     inactive=7d
                     use_temp_path=off;

    # Rendered templates land here, not in /etc/nginx/conf.d: the container
    # filesystem is read-only and /tmp is the tmpfs. Set
    # NGINX_ENVSUBST_OUTPUT_DIR=/tmp/nginx to match.
    include /tmp/nginx/*.conf;
}
