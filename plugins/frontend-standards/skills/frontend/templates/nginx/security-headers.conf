# =============================================================================
# security-headers.conf — copied to /etc/nginx/snippets/security-headers.conf
#
# The POLICY (which headers, which values) is owned by 06-SECURITY.md
# [SEC-06] and [SEC-10]. This file is only the delivery mechanism.
#
# It lives under /etc/nginx/snippets/, NOT under conf.d/ and NOT under the
# envsubst output dir: conf.d/*.conf is included inside http{} by nginx.conf,
# and an add_header at http level is inherited by every server, which is
# exactly the behaviour the include-per-location pattern is trying to control.
#
# HOW TO USE IT ([NGX-10]): every location{} that declares ANY add_header of
# its own MUST include this file, because a location-level add_header
# REPLACES the whole inherited set rather than appending to it.
#
#   location = /config.js {
#       include /etc/nginx/snippets/security-headers.conf;   # first
#       add_header Cache-Control "no-store" always;          # then yours
#   }
#
# `always` is required on all of them: without it nginx drops the header on
# error responses (4xx/5xx), which is exactly where a sniffed content type or
# a framed error page hurts.
# =============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# $csp is set once at server level in default.conf.template (it needs the
# public host name, which comes from the environment). nginx omits an
# add_header whose value evaluates to the empty string, so a server that does
# not set $csp simply sends no CSP instead of sending a broken one.
add_header Content-Security-Policy $csp always;

# Deploy verification header. Cheap, and it turns "which release am I on?"
# into one curl. $app_release is set at server level.
add_header X-App-Release $app_release always;

# Strict-Transport-Security is deliberately NOT here. It is set only by the
# component that terminates TLS ([SEC-10]). If this nginx holds the
# certificate, add it inside the TLS server block, not in this shared include.
